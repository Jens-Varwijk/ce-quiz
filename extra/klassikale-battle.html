<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CE Battle Quiz</title>
<style>
:root{
  --groen-900:#0d3b2c; --groen-800:#13503b; --groen-700:#1d6b4a; --groen-500:#2f9e64; --groen-300:#9ad8b0; --groen-100:#e3f4e8;
  --bg:#f3f1ea; --zand:#e7dfcd; --aarde:#7a5a3a; --wit:#ffffff; --tekst:#14251d; --tekst-zacht:#4b5d53;
  --goed:#1f9d55; --fout:#c0392b; --waarschuw:#d98e04;
  --p0:#0e7c86; --p1:#b8730f; --p2:#6b4c9a; --p3:#b5523b;
  --radius:18px; --schaduw:0 6px 22px rgba(13,59,44,.12);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tekst);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:clamp(16px,1.15vw,22px);display:flex;flex-direction:column;min-height:100vh}
button{font:inherit;cursor:pointer;border:none;border-radius:12px}
button:disabled{cursor:default}
button:focus-visible,input:focus-visible{outline:4px solid var(--waarschuw);outline-offset:2px}

/* Kopbalk */
header{background:var(--groen-900);color:var(--wit);display:flex;align-items:center;gap:1rem;padding:.6rem 1.4rem;flex-wrap:wrap}
.logo{font-weight:800;font-size:1.35em;letter-spacing:.02em;display:flex;align-items:center;gap:.5rem}
.logo span{color:var(--groen-300)}
.voortgang{font-size:1.05em;opacity:.9;margin-left:.5rem}
.kop-rechts{margin-left:auto;display:flex;gap:.5rem;align-items:center}
.knop-klein{background:var(--groen-700);color:var(--wit);padding:.5rem .9rem;font-size:.9em;font-weight:600}
.knop-klein:hover{background:var(--groen-500)}
.timer{display:none;align-items:center;gap:.6rem;font-weight:800;font-size:1.6em;min-width:7.5em}
.timer.zichtbaar{display:flex}
.timer-balk{flex:1;height:12px;background:rgba(255,255,255,.2);border-radius:6px;overflow:hidden;min-width:90px}
.timer-vul{height:100%;background:var(--groen-300);transition:width .1s linear}
.timer.krap .timer-vul{background:#ff9a7a}
.timer.krap .timer-getal{color:#ffb39c}

/* Scorebord */
#scorebord{display:grid;grid-template-columns:repeat(4,1fr);gap:.8rem;padding:.8rem 1.4rem 0}
.speler{background:var(--wit);border-radius:var(--radius);padding:.6rem 1rem;display:flex;align-items:center;gap:.8rem;box-shadow:var(--schaduw);border:4px solid transparent;position:relative;transition:transform .2s}
.speler.actief{border-color:var(--kleur);transform:translateY(-3px)}
.speler.gebuzzed{border-color:var(--kleur);box-shadow:0 0 0 6px color-mix(in srgb,var(--kleur) 35%,transparent);animation:buzz .5s ease}
.speler.uit{opacity:.45}
.toets{background:var(--kleur);color:var(--wit);font-weight:800;width:2.2em;height:2.2em;border-radius:10px;display:grid;place-items:center;font-size:1.15em;flex:none}
.speler-info{flex:1;min-width:0}
.speler-naam{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.speler-sub{font-size:.8em;color:var(--tekst-zacht)}
.speler-score{font-weight:800;font-size:1.8em;color:var(--groen-900)}
.speler-score.bump{animation:bump .6s ease}
.delta{position:absolute;right:.8rem;top:-.9rem;font-weight:800;padding:.1rem .6rem;border-radius:999px;color:var(--wit);animation:zweef 1.8s ease forwards}
.delta.plus{background:var(--goed)} .delta.min{background:var(--fout)}

/* Podium-achtige hoofdzone */
main{flex:1;padding:1rem 1.4rem 1.4rem;display:flex;flex-direction:column;position:relative}
.kaart{background:var(--wit);border-radius:var(--radius);box-shadow:var(--schaduw);padding:1.6rem 2rem}
.centreer{max-width:1200px;width:100%;margin:0 auto}
h1{font-size:2.6em;margin:.2em 0;color:var(--groen-900)}
h2{font-size:1.9em;margin:.2em 0 .5em;color:var(--groen-900)}
.label{display:inline-block;background:var(--groen-100);color:var(--groen-800);font-weight:700;padding:.25rem .8rem;border-radius:999px;font-size:.85em;margin-right:.4rem}
.label.aarde{background:var(--zand);color:var(--aarde)}
.knop{background:var(--groen-700);color:var(--wit);font-weight:700;padding:.85rem 1.6rem;font-size:1.1em;box-shadow:0 3px 0 var(--groen-900)}
.knop:hover:not(:disabled){background:var(--groen-500)}
.knop.secundair{background:var(--zand);color:var(--groen-900);box-shadow:0 3px 0 #c9bc9f}
.knop.secundair:hover{background:#ddd2bb}
.knop:disabled{opacity:.45}
.acties{display:flex;gap:.8rem;flex-wrap:wrap;margin-top:1.2rem;align-items:center}
.hint{color:var(--tekst-zacht);font-size:.85em}
kbd{background:var(--zand);border-radius:6px;padding:.05rem .45rem;font-family:inherit;font-weight:700;color:var(--groen-900)}

/* Setup */
.setup-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem;margin:1.2rem 0}
.setup-veld{display:flex;align-items:center;gap:.8rem;background:var(--bg);border-radius:14px;padding:.7rem}
.setup-veld input{flex:1;font:inherit;font-size:1.15em;padding:.6rem .8rem;border:2px solid var(--zand);border-radius:10px;min-width:0}
.rondes-overzicht{display:grid;grid-template-columns:repeat(5,1fr);gap:.7rem;margin-top:1rem}
.ronde-tegel{background:var(--groen-100);border-radius:14px;padding:.8rem;text-align:center}
.ronde-tegel b{display:block;font-size:1.15em;color:var(--groen-900)}
.ronde-tegel small{color:var(--tekst-zacht)}

/* Intro */
.intro-nr{font-size:1.1em;font-weight:700;color:var(--groen-500);text-transform:uppercase;letter-spacing:.12em}
.regels{font-size:1.2em;line-height:1.55;padding-left:1.2em}
.regels li{margin:.3em 0}

/* Vraag */
.vraag-kop{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:.8rem}
.beurt{margin-left:auto;font-weight:800;font-size:1.15em;padding:.35rem 1rem;border-radius:999px;color:var(--wit);background:var(--kleur)}
.vraagtekst{font-size:clamp(1.5rem,2.3vw,2.7rem);font-weight:700;line-height:1.3;color:var(--groen-900);margin:.2em 0 .8em}
.opties{display:grid;grid-template-columns:1fr 1fr;gap:.9rem}
.optie{background:var(--bg);border:3px solid var(--zand);text-align:left;padding:1rem 1.2rem;font-size:clamp(1.1rem,1.55vw,1.75rem);line-height:1.3;display:flex;gap:.9rem;align-items:flex-start;color:var(--tekst);transition:background .15s,border-color .15s,transform .15s}
.optie:hover:not(:disabled){border-color:var(--groen-500);background:var(--groen-100);transform:translateY(-2px)}
.optie .nr{background:var(--groen-800);color:var(--wit);font-weight:800;border-radius:8px;min-width:1.7em;height:1.7em;display:grid;place-items:center;flex:none}
.optie.goed{background:#dff5e7;border-color:var(--goed);animation:pop .45s ease}
.optie.goed .nr{background:var(--goed)}
.optie.fout{background:#fbe3df;border-color:var(--fout);animation:schud .4s ease}
.optie.fout .nr{background:var(--fout)}
.optie.gedimd{opacity:.5}
.status{font-size:1.3em;font-weight:700;padding:.8rem 1.1rem;border-radius:14px;margin:.9rem 0 0;display:flex;align-items:center;gap:.6rem}
.status.info{background:var(--groen-100);color:var(--groen-900)}
.status.goed{background:#dff5e7;color:#13643a}
.status.fout{background:#fbe3df;color:#8e2418}
.status.wacht{background:#fff3d6;color:#7a5200}
.buzz-legenda{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;margin:.4rem 0 1rem;font-size:1.25em;font-weight:700}
.buzz-legenda span{padding:.35rem .9rem;border-radius:12px;color:var(--wit);background:var(--kleur)}
.buzz-legenda span.uit{opacity:.35;text-decoration:line-through}
.buzz-groot{font-size:2em;font-weight:800;text-align:center;padding:.6rem;border-radius:16px;color:var(--wit);background:var(--kleur);animation:pop .4s ease;margin-bottom:.8rem}

/* Uitleg */
.uitleg{margin-top:1rem;background:var(--groen-100);border-left:8px solid var(--groen-700);border-radius:14px;padding:1rem 1.3rem;display:grid;grid-template-columns:1fr 1fr;gap:.6rem 1.6rem;animation:inschuif .4s ease}
.uitleg div{line-height:1.45}
.uitleg b{display:block;color:var(--groen-800);font-size:.85em;text-transform:uppercase;letter-spacing:.06em;margin-bottom:.15rem}
.uitleg .breed{grid-column:1/-1}

/* Volgorde */
.volgorde-lijst{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:.7rem}
.vrij{display:flex;align-items:center;gap:.9rem;background:var(--bg);border:3px solid var(--zand);border-radius:14px;padding:.75rem 1rem;font-size:clamp(1.1rem,1.5vw,1.65rem);cursor:grab;user-select:none}
.vrij.sleept{opacity:.4}
.vrij.over{border-color:var(--groen-500);background:var(--groen-100)}
.vrij .pos{background:var(--groen-800);color:var(--wit);font-weight:800;border-radius:10px;width:1.9em;height:1.9em;display:grid;place-items:center;flex:none}
.vrij .tekst{flex:1}
.vrij .pijl{background:var(--wit);border:2px solid var(--zand);width:2.4em;height:2.4em;font-size:1em;color:var(--groen-900);font-weight:800}
.vrij .pijl:hover:not(:disabled){background:var(--groen-100)}
.vrij.goed{border-color:var(--goed);background:#dff5e7;cursor:default}
.vrij.fout{border-color:var(--fout);background:#fbe3df;cursor:default}
.juiste{font-size:.75em;color:var(--tekst-zacht);font-weight:600}

/* Koppelen */
.koppel{display:grid;grid-template-columns:1fr 1.6fr;gap:1.4rem}
.kolom{display:flex;flex-direction:column;gap:.7rem}
.kolom h3{margin:0 0 .2rem;color:var(--tekst-zacht);font-size:.9em;text-transform:uppercase;letter-spacing:.08em}
.concept{background:var(--bg);border:3px solid var(--zand);padding:.85rem 1rem;font-size:clamp(1.1rem,1.45vw,1.6rem);font-weight:700;color:var(--groen-900);text-align:left;display:flex;align-items:center;gap:.7rem;min-height:3.4em}
.concept.gekozen{border-color:var(--groen-700);background:var(--groen-100);box-shadow:0 0 0 4px var(--groen-300)}
.concept .badge{margin-left:auto;background:var(--groen-800);color:var(--wit);border-radius:8px;min-width:1.8em;height:1.8em;display:grid;place-items:center;font-weight:800}
.concept .badge.leeg{background:transparent;border:2px dashed var(--zand)}
.casus{background:var(--wit);border:3px solid var(--zand);padding:.75rem 1rem;font-size:clamp(1rem,1.3vw,1.45rem);text-align:left;color:var(--tekst);display:flex;gap:.8rem;align-items:center;line-height:1.3;min-height:3.4em}
.casus:hover:not(:disabled){border-color:var(--groen-500)}
.casus .nr{background:var(--aarde);color:var(--wit);font-weight:800;border-radius:8px;min-width:1.8em;height:1.8em;display:grid;place-items:center;flex:none}
.casus.bezet{background:var(--bg)}
.concept.goed{border-color:var(--goed);background:#dff5e7}
.concept.fout{border-color:var(--fout);background:#fbe3df}
.concept .correctie{font-size:.7em;font-weight:600;color:var(--tekst-zacht);display:block}

/* Finale */
.inzetten{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;margin:1.2rem 0}
.inzet{background:var(--groen-800);color:var(--wit);font-size:1.8em;font-weight:800;padding:1rem 2rem;min-width:6.5em;box-shadow:0 5px 0 var(--groen-900)}
.inzet:hover{background:var(--groen-500)}
.inzet small{display:block;font-size:.45em;font-weight:600;opacity:.85}
.inzet-kaart{text-align:center}

/* Tussenstand / podium */
.stand{display:flex;flex-direction:column;gap:.5rem;margin:1rem 0;max-width:640px}
.stand-rij{display:flex;align-items:center;gap:.8rem;background:var(--bg);border-radius:12px;padding:.5rem .9rem;font-size:1.2em}
.stand-rij .plek{font-weight:800;width:1.8em}
.stand-rij .naam{flex:1;font-weight:700}
.podium-wrap{display:flex;align-items:flex-end;justify-content:center;gap:1.2rem;margin:1.5rem 0 1rem;min-height:340px}
.podium-plek{display:flex;flex-direction:column;align-items:center;width:min(22vw,260px)}
.podium-naam{font-size:1.5em;font-weight:800;color:var(--groen-900);text-align:center}
.podium-score{font-size:1.2em;font-weight:700;color:var(--tekst-zacht);margin-bottom:.5rem;text-align:center}
.podium-blok{width:100%;border-radius:16px 16px 0 0;display:grid;place-items:start center;padding-top:.6rem;font-size:3em;color:var(--wit);animation:rijs .9s cubic-bezier(.2,.9,.3,1.2) both}
.p1 .podium-blok{height:240px;background:linear-gradient(var(--groen-500),var(--groen-800));animation-delay:.9s}
.p2 .podium-blok{height:170px;background:linear-gradient(#5d8c74,var(--groen-800));animation-delay:.5s}
.p3 .podium-blok{height:120px;background:linear-gradient(#8a7158,var(--aarde));animation-delay:.2s}
.vierde{text-align:center;font-size:1.25em;color:var(--tekst-zacht);margin-bottom:.6rem}
.confetti{position:fixed;top:-20px;width:10px;height:16px;border-radius:2px;pointer-events:none;animation:val linear forwards;z-index:5}

/* Pauze */
#pauze{position:fixed;inset:0;background:rgba(13,59,44,.88);color:var(--wit);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:10;gap:1.2rem;text-align:center}
#pauze.aan{display:flex}
#pauze h1{color:var(--wit);font-size:4em}

/* Animaties (subtiel) */
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes schud{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes buzz{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes zweef{0%{opacity:0;transform:translateY(8px)}15%{opacity:1;transform:translateY(0)}80%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
@keyframes inschuif{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes rijs{from{transform:scaleY(0);transform-origin:bottom}to{transform:scaleY(1);transform-origin:bottom}}
@keyframes val{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Responsief: laptop/tablet */
@media (max-width:1000px){
  #scorebord{grid-template-columns:repeat(2,1fr)}
  .opties,.uitleg,.koppel{grid-template-columns:1fr}
  .rondes-overzicht{grid-template-columns:repeat(2,1fr)}
  .setup-grid{grid-template-columns:1fr}
  .kaart{padding:1.2rem}
}
</style>
</head>
<body>
<header>
  <div class="logo">♻️ CE <span>Battle</span></div>
  <div class="voortgang" id="voortgang"></div>
  <div class="kop-rechts">
    <div class="timer" id="timer"><span class="timer-getal" id="timer-getal">10</span><div class="timer-balk"><div class="timer-vul" id="timer-vul"></div></div></div>
    <button class="knop-klein" id="knop-pauze" title="Pauze (P)">⏸ Pauze</button>
    <button class="knop-klein" id="knop-herstart" title="Herstart de battle">↺ Herstart</button>
    <button class="knop-klein" id="knop-fullscreen" title="Volledig scherm">⛶ Volledig scherm</button>
  </div>
</header>
<section id="scorebord" aria-live="polite"></section>
<main id="podium-zone"><div id="stage"></div></main>
<div id="pauze" role="dialog" aria-label="Gepauzeerd">
  <h1>⏸ Gepauzeerd</h1>
  <p style="font-size:1.4em">De timer staat stil. Druk op <kbd>P</kbd> of klik hieronder om verder te gaan.</p>
  <button class="knop" id="knop-hervat">▶ Hervatten</button>
</div>

<script>
"use strict";
/* =====================================================================
   CE BATTLE QUIZ — Minor Circulaire Economie (HBO)
   Volledig offline: alle HTML, CSS, JS en vragen staan in dit bestand.

   VRAGENBANK UITBREIDEN
   Voeg objecten toe aan VRAGEN. Velden:
     ronde      1 t/m 5 (bepaalt in welke ronde de vraag verschijnt)
     type       "mc" (meerkeuze), "volgorde" of "koppelen"
     categorie  onderwerp, getoond als label
     vraag      vraagtekst / casus
     mc:        opties [4 strings], correct (index 0-3 in opties)
     volgorde:  items [4 strings] IN DE JUISTE VOLGORDE (app husselt zelf)
     koppelen:  paren [[concept, casus] x4] — juiste combinaties (app husselt zelf)
     uitleg     { goed, concept, afleider, systeem? }
   Scoring staat per ronde in RONDES (puntenGoed, puntenFout, puntenPerDeel, inzetten).
   ===================================================================== */

const RONDES = [
  { nr:1, id:"sprint", titel:"Sprint", type:"mc", tijd:10, puntenGoed:100, puntenFout:0,
    sub:"10 sec · meerkeuze",
    regels:["Elke vraag is voor één speler; de beurt rouleert (3 vragen per speler).",
            "Je hebt 10 seconden. Kies met de muis of met de toetsen 1 t/m 4.",
            "Goed antwoord: +100 punten. Fout of te laat: 0 punten.",
            "Na elke vraag volgt een korte uitleg."] },
  { nr:2, id:"buzzer", titel:"Buzzer", type:"mc", tijdBuzz:20, tijd:10, puntenGoed:150, puntenFout:-50,
    sub:"A · F · J · L",
    regels:["Iedereen speelt mee. Buzz zo snel mogelijk met je eigen toets: A, F, J of L.",
            "Alleen wie als eerste buzzt mag antwoorden (10 seconden, muis of toets 1 t/m 4).",
            "Goed: +150 punten. Fout of te laat: −50 punten (score gaat niet onder 0) en de anderen mogen opnieuw buzzen.",
            "Per vraag kun je maar één keer buzzen. Na 20 seconden zonder buzz wordt het antwoord getoond."] },
  { nr:3, id:"volgorde", titel:"Volgorde", type:"volgorde", tijd:45, puntenPerDeel:50,
    sub:"zet 4 stappen op volgorde",
    regels:["Elke vraag is voor één speler; de beurt rouleert.",
            "Zet de vier elementen in de juiste volgorde: slepen of met de pijltjes ▲ ▼.",
            "De quizmaster klikt op ‘Antwoord controleren’. Na 45 seconden wordt automatisch gecontroleerd.",
            "50 punten per element op de juiste plek (max. 200)."] },
  { nr:4, id:"koppelen", titel:"Koppelen", type:"koppelen", tijd:60, puntenPerDeel:50,
    sub:"concept ↔ casus",
    regels:["Elke vraag is voor één speler; de beurt rouleert.",
            "Klik een concept en daarna de casus die erbij hoort. Elke casus hoort bij precies één concept.",
            "De quizmaster klikt op ‘Antwoord controleren’. Na 60 seconden wordt automatisch gecontroleerd.",
            "50 punten per juiste koppeling (max. 200)."] },
  { nr:5, id:"finale", titel:"Finale met inzet", type:"mc", tijd:45, inzetten:[100,250,500],
    sub:"durf jij alles in te zetten?",
    regels:["Elke speler krijgt 3 integrale finalevragen; de beurt rouleert.",
            "Vóór de vraag zie je alleen het onderwerp en kies je je inzet: 100, 250, 500 of alles.",
            "Je kunt nooit meer inzetten dan je huidige score. Heb je 0 punten, dan speel je met inzet 0.",
            "Goed: inzet erbij. Fout of te laat (45 sec): inzet eraf."] }
];

/* ---------------------------------------------------------------------
   VRAGENBANK — 60 vragen (12 per ronde)
   --------------------------------------------------------------------- */
const VRAGEN = [
/* ===== RONDE 1 — SPRINT (meerkeuze, 10 sec) ===== */
{ ronde:1, type:"mc", categorie:"Circulariteit · R-ladder",
  vraag:"Een smartphonemerk ontwerpt modulaire telefoons waarbij gebruikers zelf een kapotte camera kunnen vervangen. Welke R-strategie staat centraal?",
  opties:["Repair","Reuse","Recycle","Reduce"], correct:0,
  uitleg:{ goed:"Het product wordt hersteld zodat het zijn oorspronkelijke functie behoudt bij dezelfde gebruiker.",
    concept:"R-ladder: Repair (R4) — levensduurverlenging op productniveau.",
    afleider:"Reuse is hergebruik van het héle product door een nieuwe gebruiker; Recycle werkt pas op materiaalniveau en verliest de productwaarde.",
    systeem:"Modulair ontwerp is een ontwerpkeuze die repareren goedkoop maakt — ontwerp stuurt gedrag." } },

{ ronde:1, type:"mc", categorie:"Rapportage · Materialiteit",
  vraag:"Een bedrijf rapporteert hoeveel biodiversiteit het in zijn keten aantast én hoe droogte de eigen grondstoffenaanvoer bedreigt. Welk principe past hier precies bij?",
  opties:["Dubbele materialiteit","Triple Bottom Line","Financiële materialiteit","Zes kapitalen (IIRC)"], correct:0,
  uitleg:{ goed:"Het combineert inside-out (impact van het bedrijf op de wereld) en outside-in (impact van de wereld op het bedrijf).",
    concept:"Dubbele materialiteit, de kern van de CSRD.",
    afleider:"Financiële materialiteit kijkt alleen outside-in; TBL en de zes kapitalen beschrijven waardecreatie, niet deze tweezijdige toets.",
    systeem:"Bedrijf en omgeving beïnvloeden elkaar wederzijds: een feedbackrelatie." } },

{ ronde:1, type:"mc", categorie:"Circulaire businessmodellen",

/* ---------------------------------------------------------------------
   HULPFUNCTIES
   --------------------------------------------------------------------- */
const $ = id => document.getElementById(id);
function el(tag, props, ...kinderen){
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(props || {})){
    if (k === "class") n.className = v;
    else if (k === "style") n.style.cssText = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v === true) n.setAttribute(k, "");
    else if (v !== false && v != null) n.setAttribute(k, v);
  }
  for (const c of kinderen.flat()){
    if (c == null || c === false) continue;
    n.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return n;
}
function hussel(arr){ const a = arr.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function husselNietIdentiek(n){ let a; do { a = hussel([...Array(n).keys()]); } while (a.every((v,i)=>v===i)); return a; }

/* Korte buzzer-piep (WebAudio, werkt offline) */
let audioCtx = null;
function piep(freq=880, duur=.15){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = freq; o.type = "square"; g.gain.value = .06;
    o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + duur);
  }catch(e){}
}

/* ---------------------------------------------------------------------
   STATE
   --------------------------------------------------------------------- */
const TOETSEN = ["A","F","J","L"];
const S = {
  fase:"setup",        // setup | intro | vraag | tussenstand | einde
  spelers:[],          // {naam, score, goed}
  namen:["","","",""],
  ronde:0, vraag:0, vragen:[],
  q:null,              // toestand van de huidige vraag
  gepauzeerd:false,
  delta:{},            // puntenwijzigingen voor animatie
  uitlegZichtbaar:true
};
const ronde = () => RONDES[S.ronde];
const huidig = () => S.vragen[S.vraag];
const kleur = i => `var(--p${i})`;

function punten(speler, aantal, telAlsGoed){
  const sp = S.spelers[speler];
  const oud = sp.score;
  sp.score = Math.max(0, sp.score + aantal);
  if (telAlsGoed) sp.goed++;
  const echt = sp.score - oud;
  if (echt !== 0) S.delta[speler] = echt;
}

/* ---------------------------------------------------------------------
   TIMER (pauzeerbaar)
   --------------------------------------------------------------------- */
const T = { id:null, rest:0, totaal:0, einde:null, vorige:0 };
function startTimer(sec, einde){
  stopTimer();
  T.totaal = T.rest = sec*1000; T.einde = einde; T.vorige = performance.now();
  T.id = setInterval(tik, 100); tekenTimer();
}
function tik(){
  const nu = performance.now(), dt = nu - T.vorige; T.vorige = nu;
  if (S.gepauzeerd) return;
  T.rest -= dt;
  if (T.rest <= 0){ T.rest = 0; const f = T.einde; stopTimer(); tekenTimer(); f && f(); }
  else tekenTimer();
}
function stopTimer(){ clearInterval(T.id); T.id = null; tekenTimer(); }
function tekenTimer(){
  const t = $("timer");
  t.classList.toggle("zichtbaar", T.id !== null);
  t.classList.toggle("krap", T.rest <= 3000 * Math.min(1, T.totaal/10000));
  $("timer-getal").textContent = Math.ceil(T.rest/1000);
  $("timer-vul").style.width = (T.totaal ? T.rest/T.totaal*100 : 0) + "%";
}

/* ---------------------------------------------------------------------
   FLOW
   --------------------------------------------------------------------- */
function startBattle(){
  S.namen = [0,1,2,3].map(i => ($("naam"+i).value || "").trim());
  S.spelers = S.namen.map((n,i) => ({ naam: n || `Speler ${i+1}`, score:0, goed:0 }));
  S.ronde = 0; S.delta = {};
  toonIntro();
}
function toonIntro(){ stopTimer(); S.fase = "intro"; render(); }
function startRonde(){
  S.vragen = hussel(VRAGEN.filter(v => v.ronde === ronde().nr));
  S.vraag = 0;
  toonVraag();
}
function toonVraag(){
  const q = huidig(), r = ronde();
  S.fase = "vraag"; S.uitlegZichtbaar = true;
  const beurt = S.vraag % 4;
  if (r.id === "sprint"){
    S.q = { volgorde:hussel([0,1,2,3]), beurt, klaar:false, gekozen:null };
    render(); startTimer(r.tijd, () => sprintAntwoord(null));
  } else if (r.id === "buzzer"){
    S.q = { volgorde:hussel([0,1,2,3]), stap:"open", gebuzzed:null, uit:[], fout:[], klaar:false, melding:null };
    render(); startTimer(r.tijdBuzz, buzzerNiemand);
  } else if (r.id === "volgorde"){
    S.q = { items:husselNietIdentiek(q.items.length), beurt, klaar:false, sleep:null };
    render(); startTimer(r.tijd, volgordeControle);
  } else if (r.id === "koppelen"){
    S.q = { casus:husselNietIdentiek(q.paren.length), koppeling:[null,null,null,null], selectie:0, beurt, klaar:false };
    render(); startTimer(r.tijd, koppelControle);
  } else if (r.id === "finale"){
    S.q = { volgorde:hussel([0,1,2,3]), beurt, stap:"inzet", inzet:null, klaar:false, gekozen:null };
    render();
  }
}
function volgendeVraag(){
  if (!S.q || !S.q.klaar) return;
  stopTimer();
  S.vraag++;
  if (S.vraag >= S.vragen.length) rondeKlaar(); else toonVraag();
}
function rondeKlaar(){
  stopTimer();
  if (S.ronde < RONDES.length - 1){ S.fase = "tussenstand"; render(); }
  else { S.fase = "einde"; render(); confetti(); }
}
function naarVolgendeRonde(){ S.ronde++; toonIntro(); }

/* ---- Sprint ---- */
function sprintAntwoord(idx){
  if (S.q.klaar) return;
  stopTimer();
  S.q.klaar = true; S.q.gekozen = idx;
  const goed = idx === huidig().correct;
  if (goed) punten(S.q.beurt, ronde().puntenGoed, true);
  S.q.resultaat = goed ? "goed" : (idx === null ? "tijd" : "fout");
  render();
}

/* ---- Buzzer ---- */
function buzz(speler){
  const q = S.q;
  if (!q || q.klaar || q.stap !== "open" || q.uit.includes(speler)) return;
  q.gebuzzed = speler; q.stap = "antwoord"; q.melding = null;
  piep(660 + speler*110);
  render(); startTimer(ronde().tijd, () => buzzerAntwoord(null));
}
function buzzerAntwoord(idx){
  const q = S.q;
  if (q.klaar || q.stap !== "antwoord") return;
  stopTimer();
  const p = q.gebuzzed, r = ronde();
  if (idx === huidig().correct){
    punten(p, r.puntenGoed, true);
    q.klaar = true; q.gekozen = idx; q.resultaat = "goed"; q.winnaar = p;
  } else {
    punten(p, r.puntenFout, false);
    q.uit.push(p);
    if (idx !== null) q.fout.push(idx);
    q.melding = `${S.spelers[p].naam}: ${idx === null ? "te laat" : "fout"} (${r.puntenFout})`;
    q.gebuzzed = null;
    if (q.uit.length >= 4){ q.klaar = true; q.resultaat = "niemand"; }
    else { q.stap = "open"; render(); startTimer(r.tijdBuzz, buzzerNiemand); return; }
  }
  render();
}
function buzzerNiemand(){
  const q = S.q;
  if (q.klaar) return;
  stopTimer(); q.klaar = true; q.resultaat = "niemand"; q.gebuzzed = null; render();
}

/* ---- Finale ---- */
function inzetOpties(score){
  const opties = [...new Set([...ronde().inzetten, score])].filter(v => v > 0 && v <= score).sort((a,b)=>a-b);
  return opties.length ? opties : [0];
}
function kiesInzet(v){
  if (S.q.stap !== "inzet") return;
  S.q.inzet = Math.min(v, S.spelers[S.q.beurt].score);
  S.q.stap = "antwoord";
  render(); startTimer(ronde().tijd, () => finaleAntwoord(null));
}
function finaleAntwoord(idx){
  const q = S.q;
  if (q.klaar || q.stap !== "antwoord") return;
  stopTimer();
  q.klaar = true; q.gekozen = idx;
  const goed = idx === huidig().correct;
  punten(q.beurt, goed ? q.inzet : -q.inzet, goed);
  q.resultaat = goed ? "goed" : (idx === null ? "tijd" : "fout");
  render();
}

/* ---- Volgorde ---- */
function verplaats(van, naar){
  const it = S.q.items;
  if (S.q.klaar || naar < 0 || naar >= it.length || van === naar) return;
  const [x] = it.splice(van, 1); it.splice(naar, 0, x);
  render();
}
function volgordeControle(){
  const q = S.q; if (q.klaar) return;
  stopTimer();
  q.klaar = true;
  q.aantalGoed = q.items.filter((v,i) => v === i).length;
  punten(q.beurt, q.aantalGoed * ronde().puntenPerDeel, q.aantalGoed === q.items.length);
  render();
}

/* ---- Koppelen ---- */
function kiesConcept(i){ if (!S.q.klaar){ S.q.selectie = i; render(); } }
function kiesCasus(c){
  const q = S.q; if (q.klaar) return;
  if (q.selectie === null) q.selectie = q.koppeling.findIndex(k => k === null);
  if (q.selectie < 0 || q.selectie === null) return;
  q.koppeling = q.koppeling.map(k => k === c ? null : k);  // casus maar één keer gebruiken
  q.koppeling[q.selectie] = c;
  const volgende = q.koppeling.findIndex(k => k === null);
  q.selectie = volgende >= 0 ? volgende : null;
  render();
}
function koppelControle(){
  const q = S.q; if (q.klaar) return;
  stopTimer();
  q.klaar = true; q.selectie = null;
  q.aantalGoed = q.koppeling.filter((k,i) => k === i).length;
  punten(q.beurt, q.aantalGoed * ronde().puntenPerDeel, q.aantalGoed === q.koppeling.length);
  render();
}

/* ---- Bediening ---- */
function togglePauze(){
  if (S.fase === "setup" || S.fase === "einde") return;
  S.gepauzeerd = !S.gepauzeerd;
  $("pauze").classList.toggle("aan", S.gepauzeerd);
  $("knop-pauze").textContent = S.gepauzeerd ? "▶ Hervat" : "⏸ Pauze";
  if (S.gepauzeerd) $("knop-hervat").focus();
}
function herstart(){
  if (S.fase !== "setup" && S.fase !== "einde" && !confirm("Weet je zeker dat je de battle wilt herstarten? Alle scores gaan verloren.")) return;
  stopTimer();
  if (S.gepauzeerd) togglePauze();
  S.fase = "setup"; S.q = null; S.spelers = []; S.delta = {};
  render();
}
/* Mapt toets 1-4 (positie op het scherm) naar optie-index en stuurt door naar de juiste ronde */
function kiesPositie(pos){
  const q = S.q, r = ronde();
  if (!q || q.klaar || !q.volgorde) return;
  const idx = q.volgorde[pos];
  if (idx === undefined) return;
  if (r.id === "sprint") sprintAntwoord(idx);
  else if (r.id === "buzzer" && q.stap === "antwoord" && !q.fout.includes(idx)) buzzerAntwoord(idx);
  else if (r.id === "finale" && q.stap === "antwoord") finaleAntwoord(idx);
}

document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT"){ if (e.key === "Enter" && S.fase === "setup") startBattle(); return; }
  if (e.repeat) return;
  const k = e.key.toLowerCase();
  if (k === "p"){ togglePauze(); return; }
  if (S.gepauzeerd) return;
  if (S.fase === "vraag"){
    if (ronde().id === "buzzer"){ const i = ["a","f","j","l"].indexOf(k); if (i >= 0){ buzz(i); return; } }
    if (["1","2","3","4"].includes(k)){ kiesPositie(+k - 1); return; }
    if (k === "arrowright" && S.q.klaar){ volgendeVraag(); return; }
  }
});
$("knop-pauze").onclick = togglePauze;
$("knop-hervat").onclick = togglePauze;
$("knop-herstart").onclick = herstart;
$("knop-fullscreen").onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(()=>{});
};

/* ---------------------------------------------------------------------
   RENDERING
   --------------------------------------------------------------------- */
function render(){
  renderKop(); renderScorebord();
  const stage = $("stage"); stage.innerHTML = "";
  const v = { setup:viewSetup, intro:viewIntro, vraag:viewVraag, tussenstand:viewTussenstand, einde:viewPodium }[S.fase];
  stage.append(v());
}

function renderKop(){
  let t = "";
  if (S.fase === "intro" || S.fase === "tussenstand") t = `Ronde ${ronde().nr} van 5 · ${ronde().titel}`;
  if (S.fase === "vraag") t = `Ronde ${ronde().nr}/5 · ${ronde().titel} · Vraag ${S.vraag+1}/${S.vragen.length}`;
  if (S.fase === "einde") t = "Einduitslag";
  $("voortgang").textContent = t;
}

function renderScorebord(){
  const sb = $("scorebord"); sb.innerHTML = "";
  sb.style.display = S.fase === "setup" ? "none" : "";
  if (S.fase === "setup") return;
  const q = S.q, r = ronde();
  S.spelers.forEach((sp, i) => {
    let cls = "speler";
    if (S.fase === "vraag" && q){
      if (r.id === "buzzer"){
        if (q.gebuzzed === i || q.winnaar === i) cls += " gebuzzed";
        if (q.uit.includes(i) && !q.klaar) cls += " uit";
      } else if (q.beurt === i) cls += " actief";
    }
    const d = S.delta[i];
    sb.append(el("div", { class:cls, style:`--kleur:${kleur(i)}` },
      el("div", { class:"toets" }, TOETSEN[i]),
      el("div", { class:"speler-info" },
        el("div", { class:"speler-naam" }, sp.naam),
        el("div", { class:"speler-sub" }, `${sp.goed} goed`)),
      el("div", { class:"speler-score" + (d ? " bump" : "") }, sp.score),
      d ? el("div", { class:"delta " + (d > 0 ? "plus" : "min") }, (d > 0 ? "+" : "") + d) : null
    ));
  });
  S.delta = {};
}

function viewSetup(){
  const velden = [0,1,2,3].map(i => el("label", { class:"setup-veld" },
    el("span", { class:"toets", style:`--kleur:${kleur(i)}` }, TOETSEN[i]),
    el("input", { id:"naam"+i, type:"text", maxlength:"20", placeholder:`Naam speler ${i+1}`, value:S.namen[i] || "" })
  ));
  return el("div", { class:"kaart centreer" },
    el("div", { class:"intro-nr" }, "Minor Circulaire Economie · HBO"),
    el("h1", {}, "Circulaire Economie Battle"),
    el("p", { style:"font-size:1.25em;margin:.2em 0" }, "Vier spelers, vijf rondes en zestig pittige vragen over systeemdenken, circulariteit en business ethics. Vul de namen in; elke speler heeft een eigen buzzertoets."),
    el("div", { class:"setup-grid" }, velden),
    el("div", { class:"rondes-overzicht" }, RONDES.map(r =>
      el("div", { class:"ronde-tegel" }, el("small", {}, `Ronde ${r.nr}`), el("b", {}, r.titel), el("small", {}, r.sub)))),
    el("div", { class:"acties" },
      el("button", { class:"knop", onclick:startBattle }, "▶ Start de battle"),
      el("span", { class:"hint" }, "Tip: zet de app op volledig scherm voor de beamer. ", el("kbd", {}, "P"), " = pauze, ", el("kbd", {}, "1–4"), " = antwoord, ", el("kbd", {}, "→"), " = volgende vraag."))
  );
}

function viewIntro(){
  const r = ronde();
  setTimeout(() => { const b = document.querySelector("#stage .knop"); b && b.focus(); }, 0);
  return el("div", { class:"kaart centreer" },
    el("div", { class:"intro-nr" }, `Ronde ${r.nr} van 5`),
    el("h1", {}, r.titel),
    el("ul", { class:"regels" }, r.regels.map(x => el("li", {}, x))),
    r.id === "buzzer" ? legendaBuzz([]) : null,
    el("div", { class:"acties" }, el("button", { class:"knop", onclick:startRonde }, `▶ Start ronde ${r.nr}`))
  );
}

function legendaBuzz(uit){
  return el("div", { class:"buzz-legenda" }, S.spelers.map((sp,i) =>
    el("span", { class: uit.includes(i) ? "uit" : "", style:`--kleur:${kleur(i)}` }, `${TOETSEN[i]} = ${sp.naam}`)));
}

function vraagKop(q, beurt){
  return el("div", { class:"vraag-kop" },
    el("span", { class:"label" }, q.categorie),
    el("span", { class:"label aarde" }, `Ronde ${ronde().nr} · ${ronde().titel}`),
    beurt != null ? el("span", { class:"beurt", style:`--kleur:${kleur(beurt)}` }, `Aan de beurt: ${S.spelers[beurt].naam}`) : null
  );
}

function viewUitleg(q){
  const u = q.uitleg;
  return el("div", { class:"uitleg" },
    el("div", {}, el("b", {}, "✔ Waarom dit klopt"), u.goed),
    el("div", {}, el("b", {}, "📘 Concept"), u.concept),
    el("div", { class: u.systeem ? "" : "breed" }, el("b", {}, "✖ Waarom niet de afleider(s)"), u.afleider),
    u.systeem ? el("div", {}, el("b", {}, "🔄 Systeemblik"), u.systeem) : null
  );
}

function knoppenNaVraag(){
  const laatste = S.vraag >= S.vragen.length - 1;
  setTimeout(() => { const b = $("knop-volgende"); b && b.focus({ preventScroll:true }); }, 0);
  return el("div", { class:"acties" },
    el("button", { class:"knop", id:"knop-volgende", onclick:volgendeVraag }, laatste ? "Ronde afronden ▶" : "Volgende vraag ▶"),
    el("button", { class:"knop secundair", onclick:() => { S.uitlegZichtbaar = !S.uitlegZichtbaar; render(); } }, S.uitlegZichtbaar ? "Uitleg verbergen" : "Toon uitleg"),
    el("span", { class:"hint" }, el("kbd", {}, "→"), " volgende vraag"));
}

function viewVraag(){
  const id = ronde().id;
  if (id === "sprint" || id === "buzzer" || id === "finale") return viewMC();
  if (id === "volgorde") return viewVolgorde();
  return viewKoppelen();
}

/* Meerkeuze (sprint, buzzer, finale) */
function viewMC(){
  const q = huidig(), s = S.q, r = ronde();
  const kaart = el("div", { class:"kaart centreer" });
  kaart.append(vraagKop(q, r.id === "buzzer" ? null : s.beurt));

  // Finale: eerst inzet kiezen, vraag nog verborgen
  if (r.id === "finale" && s.stap === "inzet"){
    const sp = S.spelers[s.beurt];
    const opties = inzetOpties(sp.score);
    kaart.append(el("div", { class:"inzet-kaart" },
      el("h2", {}, `${sp.naam}, hoeveel zet je in?`),
      el("p", { style:"font-size:1.3em" }, `Onderwerp: `, el("b", {}, q.categorie), ` · Huidige score: `, el("b", {}, sp.score)),
      el("div", { class:"inzetten" }, opties.map(v =>
        el("button", { class:"inzet", onclick:() => kiesInzet(v) }, v,
          el("small", {}, v === 0 ? "geen punten om in te zetten" : v === sp.score ? "ALLES" : "punten")))),
      el("p", { class:"hint" }, "Goed = inzet erbij · Fout of te laat = inzet eraf. De vraag verschijnt na het kiezen van de inzet.")));
    return kaart;
  }

  kaart.append(el("div", { class:"vraagtekst" }, q.vraag));

  if (r.id === "buzzer"){
    if (!s.klaar && s.stap === "open"){
      kaart.append(legendaBuzz(s.uit));
    } else if (!s.klaar && s.stap === "antwoord"){
      kaart.append(el("div", { class:"buzz-groot", style:`--kleur:${kleur(s.gebuzzed)}` }, `🔔 ${S.spelers[s.gebuzzed].naam} mag antwoorden!`));
    }
  }
  if (r.id === "finale" && !s.klaar){
    kaart.append(el("div", { class:"status wacht", style:"margin:0 0 .9rem" }, `Inzet: ${s.inzet} punten`));
  }

  const kanKiezen = !s.klaar && (r.id === "sprint" || s.stap === "antwoord");
  const opties = el("div", { class:"opties" }, s.volgorde.map((idx, pos) => {
    let cls = "optie";
    const isFout = r.id === "buzzer" && s.fout.includes(idx);
    if (s.klaar){
      if (idx === q.correct) cls += " goed";
      else if (idx === s.gekozen || isFout) cls += " fout";
      else cls += " gedimd";
    } else if (isFout) cls += " fout";
    const dis = !kanKiezen || isFout;
    const handler = () => {
      if (r.id === "sprint") sprintAntwoord(idx);
      else if (r.id === "buzzer") buzzerAntwoord(idx);
      else finaleAntwoord(idx);
    };
    return el("button", { class:cls, disabled:dis, onclick:handler }, el("span", { class:"nr" }, pos+1), el("span", {}, q.opties[idx]));
  }));
  kaart.append(opties);

  // Status
  if (r.id === "buzzer" && !s.klaar){
    if (s.melding) kaart.append(el("div", { class:"status fout" }, `✖ ${s.melding} — de anderen mogen buzzen!`));
    if (s.stap === "open"){
      kaart.append(el("div", { class:"acties" },
        el("span", { class:"status info", style:"margin:0" }, "🔔 Buzzers open: A · F · J · L"),
        el("button", { class:"knop secundair", onclick:buzzerNiemand }, "Niemand weet het — toon antwoord")));
    }
  }
  if (s.klaar){
    let tekst, cls;
    if (r.id === "buzzer"){
      if (s.resultaat === "goed"){ tekst = `✔ ${S.spelers[s.winnaar].naam} heeft het goed! +${r.puntenGoed}`; cls = "goed"; }
      else { tekst = "Niemand had het juiste antwoord."; cls = "info"; }
    } else {
      const naam = S.spelers[s.beurt].naam;
      const pt = r.id === "finale" ? s.inzet : r.puntenGoed;
      if (s.resultaat === "goed"){ tekst = `✔ Goed, ${naam}! +${pt}`; cls = "goed"; }
      else if (s.resultaat === "tijd"){ tekst = `⏱ Tijd is om, ${naam}.` + (r.id === "finale" && pt ? ` −${pt}` : ""); cls = "fout"; }
      else { tekst = `✖ Helaas, ${naam}.` + (r.id === "finale" && pt ? ` −${pt}` : ""); cls = "fout"; }
    }
    kaart.append(el("div", { class:"status " + cls }, tekst));
    if (S.uitlegZichtbaar) kaart.append(viewUitleg(q));
    kaart.append(knoppenNaVraag());
  } else if (r.id !== "buzzer"){
    kaart.append(el("p", { class:"hint", style:"margin-top:1rem" }, "Klik op een antwoord of druk op ", el("kbd", {}, "1"), "–", el("kbd", {}, "4"), "."));
  }
  return kaart;
}

/* Volgorde */
function viewVolgorde(){
  const q = huidig(), s = S.q;
  const kaart = el("div", { class:"kaart centreer" }, vraagKop(q, s.beurt), el("div", { class:"vraagtekst" }, q.vraag));
  const lijst = el("ol", { class:"volgorde-lijst" });
  s.items.forEach((itemIdx, pos) => {
    let cls = "vrij";
    if (s.klaar) cls += itemIdx === pos ? " goed" : " fout";
    const rij = el("li", { class:cls, draggable: s.klaar ? "false" : "true" },
      el("span", { class:"pos" }, pos+1),
      el("span", { class:"tekst" }, q.items[itemIdx],
        s.klaar && itemIdx !== pos ? el("span", { class:"juiste" }, ` — hoort op plek ${itemIdx+1}`) : null),
      s.klaar ? el("span", { style:"font-size:1.4em" }, itemIdx === pos ? "✔" : "✖") : [
        el("button", { class:"pijl", title:"Omhoog", disabled: pos === 0, onclick:() => verplaats(pos, pos-1) }, "▲"),
        el("button", { class:"pijl", title:"Omlaag", disabled: pos === s.items.length-1, onclick:() => verplaats(pos, pos+1) }, "▼")
      ]);
    if (!s.klaar){
      rij.addEventListener("dragstart", e => { s.sleep = pos; rij.classList.add("sleept"); e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", String(pos)); });
      rij.addEventListener("dragend", () => rij.classList.remove("sleept"));
      rij.addEventListener("dragover", e => { e.preventDefault(); rij.classList.add("over"); });
      rij.addEventListener("dragleave", () => rij.classList.remove("over"));
      rij.addEventListener("drop", e => { e.preventDefault(); if (s.sleep !== null) verplaats(s.sleep, pos); s.sleep = null; });
    }
    lijst.append(rij);
  });
  kaart.append(lijst);
  if (!s.klaar){
    kaart.append(el("div", { class:"acties" },
      el("button", { class:"knop", onclick:volgordeControle }, "✔ Antwoord controleren"),
      el("span", { class:"hint" }, "Slepen of ▲ ▼ gebruiken.")));
  } else {
    const pt = s.aantalGoed * ronde().puntenPerDeel;
    kaart.append(el("div", { class:"status " + (s.aantalGoed === 4 ? "goed" : s.aantalGoed ? "wacht" : "fout") },
      `${S.spelers[s.beurt].naam}: ${s.aantalGoed} van 4 op de juiste plek · +${pt}`));
    if (s.aantalGoed < 4) kaart.append(el("div", { class:"status info" }, "Juiste volgorde: " + q.items.map((x,i) => `${i+1}. ${x.replace(/\s*\(.*\)$/,"")}`).join("  →  ")));
    if (S.uitlegZichtbaar) kaart.append(viewUitleg(q));
    kaart.append(knoppenNaVraag());
  }
  return kaart;
}

/* Koppelen */
function viewKoppelen(){
  const q = huidig(), s = S.q;
  const kaart = el("div", { class:"kaart centreer" }, vraagKop(q, s.beurt), el("div", { class:"vraagtekst" }, q.vraag));
  const nummerVan = c => s.casus.indexOf(c) + 1;   // casus-index → getoond nummer
  const links = el("div", { class:"kolom" }, el("h3", {}, "Concept"),
    q.paren.map((p, i) => {
      const k = s.koppeling[i];
      let cls = "concept";
      if (!s.klaar && s.selectie === i) cls += " gekozen";
      if (s.klaar) cls += k === i ? " goed" : " fout";
      return el("button", { class:cls, disabled:s.klaar, onclick:() => kiesConcept(i) },
        el("span", {}, p[0], s.klaar && k !== i ? el("span", { class:"correctie" }, `juist: casus ${nummerVan(i)}`) : null),
        el("span", { class:"badge" + (k === null ? " leeg" : "") }, k === null ? "" : nummerVan(k)));
    }));
  const rechts = el("div", { class:"kolom" }, el("h3", {}, "Casus"),
    s.casus.map((c, pos) => el("button", { class:"casus" + (s.koppeling.includes(c) ? " bezet" : ""), disabled:s.klaar, onclick:() => kiesCasus(c) },
      el("span", { class:"nr" }, pos+1), el("span", {}, q.paren[c][1]))));
  kaart.append(el("div", { class:"koppel" }, links, rechts));
  if (!s.klaar){
    kaart.append(el("div", { class:"acties" },
      el("button", { class:"knop", onclick:koppelControle }, "✔ Antwoord controleren"),
      el("span", { class:"hint" }, "Klik een concept en daarna de bijbehorende casus.")));
  } else {
    const pt = s.aantalGoed * ronde().puntenPerDeel;
    kaart.append(el("div", { class:"status " + (s.aantalGoed === 4 ? "goed" : s.aantalGoed ? "wacht" : "fout") },
      `${S.spelers[s.beurt].naam}: ${s.aantalGoed} van 4 koppelingen goed · +${pt}`));
    if (S.uitlegZichtbaar) kaart.append(viewUitleg(q));
    kaart.append(knoppenNaVraag());
  }
  return kaart;
}

/* Ranglijst met gedeelde plekken bij gelijke score */
function ranglijst(){
  const lijst = S.spelers.map((sp,i) => ({ ...sp, i })).sort((a,b) => b.score - a.score || b.goed - a.goed);
  lijst.forEach((sp, n) => { sp.plek = n > 0 && sp.score === lijst[n-1].score && sp.goed === lijst[n-1].goed ? lijst[n-1].plek : n + 1; });
  return lijst;
}

function viewTussenstand(){
  const r = ronde(), volgende = RONDES[S.ronde+1];
  setTimeout(() => { const b = document.querySelector("#stage .knop"); b && b.focus(); }, 0);
  return el("div", { class:"kaart centreer" },
    el("div", { class:"intro-nr" }, `Einde ronde ${r.nr}`),
    el("h1", {}, "Tussenstand"),
    el("div", { class:"stand" }, ranglijst().map(sp =>
      el("div", { class:"stand-rij" }, el("span", { class:"plek" }, sp.plek + "."),
        el("span", { class:"toets", style:`--kleur:${kleur(sp.i)}` }, TOETSEN[sp.i]),
        el("span", { class:"naam" }, sp.naam), el("span", {}, `${sp.goed} goed`), el("b", { style:"min-width:4em;text-align:right" }, sp.score)))),
    el("div", { class:"acties" }, el("button", { class:"knop", onclick:naarVolgendeRonde }, `Door naar ronde ${volgende.nr}: ${volgende.titel} ▶`))
  );
}

function viewPodium(){
  const lijst = ranglijst();
  const medaille = { 1:"🥇", 2:"🥈", 3:"🥉" };
  const blok = (sp, posCls) => sp ? el("div", { class:"podium-plek " + posCls },
    el("div", { class:"podium-naam" }, sp.naam),
    el("div", { class:"podium-score" }, `${sp.score} punten · ${sp.goed} goed`),
    el("div", { class:"podium-blok" }, medaille[sp.plek] || `${sp.plek}e`)) : null;
  return el("div", { class:"kaart centreer", style:"text-align:center" },
    el("div", { class:"intro-nr" }, "Einduitslag"),
    el("h1", {}, `🏆 ${lijst[0].naam} wint de CE Battle!`),
    el("div", { class:"podium-wrap" }, blok(lijst[1], "p2"), blok(lijst[0], "p1"), blok(lijst[2], "p3")),
    el("div", { class:"vierde" }, `${lijst[3].plek}e plaats: `, el("b", {}, lijst[3].naam), ` — ${lijst[3].score} punten · ${lijst[3].goed} goed`),
    el("div", { class:"acties", style:"justify-content:center" }, el("button", { class:"knop", onclick:herstart }, "↺ Nieuwe battle"))
  );
}

function confetti(){
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const kleuren = ["#2f9e64","#9ad8b0","#0e7c86","#b8730f","#e7dfcd","#6b4c9a"];
  for (let i = 0; i < 90; i++){
    const c = el("div", { class:"confetti", style:`left:${Math.random()*100}vw;background:${kleuren[i%kleuren.length]};animation-duration:${2.5+Math.random()*2.5}s;animation-delay:${.8+Math.random()*1.2}s` });
    document.body.append(c); setTimeout(() => c.remove(), 7000);
  }
}

/* ---------------------------------------------------------------------
   VALIDATIE van de vragenbank (zie console)
   --------------------------------------------------------------------- */
function valideerVragenbank(){
  const fouten = [];
  if (VRAGEN.length < 60) fouten.push(`Te weinig vragen: ${VRAGEN.length}`);
  const teksten = new Set();
  VRAGEN.forEach((v, n) => {
    const tag = `Vraag #${n+1} (ronde ${v.ronde})`;
    const sleutel = v.vraag + JSON.stringify(v.items || v.paren || v.opties);
    if (teksten.has(sleutel)) fouten.push(`${tag}: dubbel`); teksten.add(sleutel);
    if (!v.uitleg || !v.uitleg.goed || !v.uitleg.concept || !v.uitleg.afleider) fouten.push(`${tag}: uitleg onvolledig`);
    if (v.type === "mc" && !(v.opties?.length === 4 && v.correct >= 0 && v.correct < 4)) fouten.push(`${tag}: opties/correct ongeldig`);
    if (v.type === "volgorde" && v.items?.length !== 4) fouten.push(`${tag}: volgorde moet 4 items hebben`);
    if (v.type === "koppelen" && v.paren?.length !== 4) fouten.push(`${tag}: koppelen moet 4 paren hebben`);
  });
  RONDES.forEach(r => { const n = VRAGEN.filter(v => v.ronde === r.nr).length; if (n < 12) fouten.push(`Ronde ${r.nr} heeft ${n} vragen`); });
  if (fouten.length) console.error("Vragenbank-validatie:", fouten); else console.info(`Vragenbank OK: ${VRAGEN.length} vragen`);
  return fouten;
}
valideerVragenbank();
render();
</script>
